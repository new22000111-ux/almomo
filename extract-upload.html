<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فك ضغط ورفع الملفات</title>
    <script src="https://unpkg.com/jszip@3/dist/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }
        
        .file-label {
            display: block;
            padding: 12px;
            background: #f0f0f0;
            border: 2px dashed #667eea;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .file-label:hover {
            background: #e8f0ff;
            border-color: #764ba2;
        }
        
        .file-name {
            color: #667eea;
            font-weight: 600;
            margin-top: 10px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        
        .progress {
            width: 100%;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        .file-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .file-item {
            padding: 8px;
            background: #f9f9f9;
            margin: 5px 0;
            border-left: 3px solid #667eea;
            font-size: 12px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 فك ضغط ورفع</h1>
        <p class="subtitle">استخرج ملفات ZIP ورفعها للمستودع</p>
        
        <div class="form-group">
            <label>GitHub Personal Access Token</label>
            <input type="password" id="token" placeholder="ghp_..." required>
        </div>
        
        <div class="form-group">
            <label>اختر ملف ZIP</label>
            <div class="file-input-wrapper">
                <input type="file" id="zipFile" accept=".zip" required>
                <label class="file-label" for="zipFile">
                    📁 اضغط لاختيار ملف ZIP أو اسحبه هنا
                </label>
                <div class="file-name" id="fileName"></div>
            </div>
        </div>
        
        <button id="uploadBtn" onclick="handleUpload()">🚀 فك ضغط ورفع</button>
        
        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="status" id="status"></div>
        <div class="file-list" id="fileList"></div>
    </div>

    <script>
        const zipInput = document.getElementById('zipFile');
        const tokenInput = document.getElementById('token');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusDiv = document.getElementById('status');
        const progressDiv = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const fileListDiv = document.getElementById('fileList');
        const fileNameDiv = document.getElementById('fileName');
        
        zipInput.addEventListener('change', (e) => {
            fileNameDiv.textContent = e.target.files[0]?.name || '';
        });
        
        document.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
        });
        
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].name.endsWith('.zip')) {
                zipInput.files = files;
                fileNameDiv.textContent = files[0].name;
            }
        });
        
        async function handleUpload() {
            const token = tokenInput.value.trim();
            const file = zipInput.files[0];
            
            if (!token) {
                showStatus('❌ الرجاء إدخال Token', 'error');
                return;
            }
            
            if (!file) {
                showStatus('❌ الرجاء اختي��ر ملف ZIP', 'error');
                return;
            }
            
            uploadBtn.disabled = true;
            progressDiv.style.display = 'block';
            fileListDiv.innerHTML = '';
            
            try {
                showStatus('⏳ جاري قراءة الملف...', 'info');
                
                // انتظر تحميل JSZip
                if (typeof JSZip === 'undefined') {
                    showStatus('❌ خطأ: مكتبة JSZip لم تحمل', 'error');
                    uploadBtn.disabled = false;
                    return;
                }
                
                const zip = new JSZip();
                await zip.loadAsync(file);
                
                const files = [];
                zip.forEach((path, fileObj) => {
                    if (!fileObj.dir) {
                        files.push({ path, file: fileObj });
                    }
                });
                
                showStatus(`✅ تم قراءة ${files.length} ملف. جاري الرفع...`, 'info');
                
                const repo = 'new22000111-ux/almomo';
                const branch = 'main';
                let successCount = 0;
                
                for (let i = 0; i < files.length; i++) {
                    const { path, file: zipFile } = files[i];
                    
                    try {
                        const content = await zipFile.async('base64');
                        
                        const response = await fetch(
                            `https://api.github.com/repos/${repo}/contents/${path}`,
                            {
                                method: 'PUT',
                                headers: {
                                    'Authorization': `token ${token}`,
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({
                                    message: `Upload extracted file: ${path}`,
                                    content: content,
                                    branch: branch
                                })
                            }
                        );
                        
                        if (response.ok) {
                            successCount++;
                            addFileToList(path, '✅');
                        } else {
                            const error = await response.json();
                            addFileToList(path, '❌ ' + (error.message || 'خطأ'));
                        }
                    } catch (err) {
                        addFileToList(path, '❌ ' + err.message);
                    }
                    
                    const progress = ((i + 1) / files.length) * 100;
                    progressBar.style.width = progress + '%';
                }
                
                showStatus(`✅ تم رفع ${successCount}/${files.length} ملف بنجاح!`, 'success');
                
            } catch (err) {
                showStatus('❌ خطأ: ' + err.message, 'error');
            } finally {
                uploadBtn.disabled = false;
            }
        }
        
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        function addFileToList(fileName, status) {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.textContent = `${status} ${fileName}`;
            fileListDiv.appendChild(item);
        }
    </script>
</body>
</html>
